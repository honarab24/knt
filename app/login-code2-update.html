<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KONEK TV Login</title><style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #080808;
    font-family: Arial, sans-serif;
    color: white;
    padding: 20px;
}

.login-box {
    width: 100%;
    max-width: 380px;
    padding: 30px 25px;
    background: #151515;
    border: 1px solid #292929;
    border-radius: 15px;
    box-shadow: 0 10px 35px rgba(0,0,0,.5);
    text-align: center;
}

.logo {
    color: #e50914;
    font-size: 30px;
    font-weight: bold;
    margin-bottom: 8px;
}

.subtitle {
    color: #aaa;
    margin-bottom: 25px;
    font-size: 14px;
}

input {
    width: 100%;
    padding: 15px;
    margin: 9px 0;
    background: #252525;
    border: 1px solid #383838;
    border-radius: 8px;
    color: white;
    font-size: 15px;
    outline: none;
}

input:focus {
    border-color: #e50914;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 15px;
    border: none;
    border-radius: 8px;
    background: #e50914;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #b80710;
}

#message {
    margin-top: 18px;
    font-size: 14px;
    line-height: 1.5;
}

.footer {
    margin-top: 25px;
    color: #777;
    font-size: 12px;
}
</style></head><body><div class="login-box"><div class="logo">KONEK TV</div>
<div class="subtitle">Enter your username and password</div>

<form id="loginForm">
    <input
        type="text"
        id="username"
        placeholder="Username"
        autocomplete="username"
        required
    >

    <input
        type="password"
        id="password"
        placeholder="Password"
        autocomplete="current-password"
        required
    >

    <button type="submit">LOGIN</button>
</form>

<div id="message"></div>

<div class="footer">
    KONEK TV &copy; 2026
</div>

</div><script>
const accounts = [
    {
        username: "konektv",
        password: "konektv",
        days: 30,
        storageKey: "login2ExpireAt"
    },
    {
        username: "konektv60d",
        password: "konektv60d",
        days: 60,
        storageKey: "login3ExpireAt"
    },
    {
        username: "konektv360d",
        password: "konektv360d",
        days: 360,
        storageKey: "login4ExpireAt"
    }
];

const form = document.getElementById("loginForm");
const message = document.getElementById("message");

form.addEventListener("submit", function(event) {
    event.preventDefault();

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;

    const account = accounts.find(item =>
        item.username === username &&
        item.password === password
    );

    if (!account) {
        message.style.color = "#ff4444";
        message.textContent = "Incorrect username or password!";
        return;
    }

    // Start a new access period after successful login.
    const expirationDate = Date.now() +
        account.days * 24 * 60 * 60 * 1000;

    localStorage.setItem(
        account.storageKey,
        expirationDate.toString()
    );

    localStorage.setItem(
        account.storageKey + "Username",
        account.username
    );

    message.style.color = "#00e676";
    message.textContent =
        "Login successful! Your access is valid for " +
        account.days + " days.";

    setTimeout(function() {
        window.location.href = "index.html";
    }, 1000);
});
</script></body>
</html>
