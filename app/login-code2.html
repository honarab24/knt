<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KONEK TV LOGIN 2</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    background: #121212;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.login-box {
    width: 90%;
    max-width: 350px;
    background: #222;
    padding: 30px;
    border-radius: 15px;
    text-align: center;
    box-shadow: 0 0 20px rgba(0,255,213,.2);
}

h2 {
    color: #00ffd5;
    margin-bottom: 25px;
}

input {
    width: 100%;
    padding: 14px;
    margin: 10px 0;
    border: 1px solid #444;
    border-radius: 8px;
    background: #111;
    color: white;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 15px;
    border: none;
    border-radius: 8px;
    background: linear-gradient(90deg,#00ffd5,#0066ff);
    color: black;
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
}

#message {
    margin-top: 15px;
    color: #ff5555;
}
</style>
</head>

<body>

<div class="login-box">
    <h2>🔐 KONEK TV LOGIN 2</h2>

    <input type="text" id="username"
    placeholder="Username" autocomplete="username">

    <input type="password" id="password"
    placeholder="Password" autocomplete="current-password">

    <button onclick="login()">LOGIN</button>

    <div id="message"></div>
</div>

<script>
function login() {
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;
    const message = document.getElementById("message");

    if (username === "konektv" && password === "konektv") {

        // SEPARATE LOCAL STORAGE FOR LOGIN 2
        const duration = 30 * 24 * 60 * 60 * 1000;
        const expireAt = Date.now() + duration;

        localStorage.setItem("login2ExpireAt", expireAt);
        localStorage.setItem("login2Username", username);

        message.style.color = "#00ffd5";
        message.innerText = "Login successful!";

        setTimeout(() => {
            window.location.href = "index.html";
        }, 800);

    } else {
        message.innerText = "Invalid username or password!";
    }
}
</script>

</body>
</html>
