<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KONEK TV Login</title><style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #080808;
    font-family: Arial, sans-serif;
    color: white;
    padding: 20px;
}

.login-box {
    width: 100%;
    max-width: 400px;
    padding: 30px 25px;
    background: #151515;
    border: 1px solid #292929;
    border-radius: 15px;
    box-shadow: 0 10px 35px rgba(0,0,0,.5);
    text-align: center;
}

.logo {
    color: #e50914;
    font-size: 32px;
    font-weight: bold;
    margin-bottom: 8px;
}

.subtitle {
    color: #aaa;
    margin-bottom: 25px;
    font-size: 14px;
}

input {
    width: 100%;
    padding: 16px;
    margin: 9px 0;
    background: #252525;
    border: 2px solid #383838;
    border-radius: 8px;
    color: white;
    font-size: 17px;
    outline: none;
}

input:focus {
    border-color: #e50914;
}

.password-container {
    position: relative;
    width: 100%;
}

.password-container input {
    padding-right: 75px;
}

.show-password {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    width: auto;
    margin: 0;
    padding: 9px;
    background: transparent;
    color: #ddd;
    font-size: 13px;
    border: none;
}

.show-password:hover {
    background: transparent;
    color: #e50914;
}

button {
    width: 100%;
    padding: 16px;
    margin-top: 15px;
    border: 2px solid transparent;
    border-radius: 8px;
    background: #e50914;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #b80710;
}

/* TV REMOTE FOCUS */
input:focus-visible,
button:focus-visible {
    outline: 3px solid #ffffff !important;
    outline-offset: 4px;
    border-color: #e50914;
    box-shadow: 0 0 15px rgba(229,9,20,.7);
}

#message {
    margin-top: 18px;
    font-size: 14px;
    line-height: 1.5;
}

.footer {
    margin-top: 25px;
    color: #777;
    font-size: 12px;
}

@media (min-width: 1000px) {
    .login-box {
        max-width: 440px;
        padding: 40px 35px;
    }

    input, button {
        font-size: 19px;
        padding: 18px;
    }

    .logo {
        font-size: 38px;
    }
}
</style></head><body><div class="login-box"><div class="logo">KONEK TV</div>

<div class="subtitle">
    Enter your username and password
</div>

<form id="loginForm">

    <input
        type="text"
        id="username"
        placeholder="Username"
        autocomplete="username"
        required
        tabindex="1"
    >

    <div class="password-container">

        <input
            type="password"
            id="password"
            placeholder="Password"
            autocomplete="current-password"
            required
            tabindex="2"
        >

        <button
            type="button"
            class="show-password"
            id="togglePassword"
            tabindex="3"
            aria-label="Show password"
        >
            SHOW
        </button>

    </div>

    <button
        type="submit"
        id="loginButton"
        tabindex="4"
    >
        LOGIN
    </button>

</form>

<div id="message" aria-live="polite"></div>

<div class="footer">
    KONEK TV &copy; 2026
</div>

</div><script>

// =================================
// ACCOUNT DATABASE
// =================================

const accounts = [
    {
        username: "konektv",
        password: "konektv",
        days: 30,
        storageKey: "login2ExpireAt"
    },
    {
        username: "konektv60d",
        password: "konektv60d",
        days: 60,
        storageKey: "login3ExpireAt"
    },
    {
        username: "konektv360d",
        password: "konektv360d",
        days: 360,
        storageKey: "login4ExpireAt"
    }
];

const form = document.getElementById("loginForm");
const usernameInput = document.getElementById("username");
const passwordInput = document.getElementById("password");
const togglePassword = document.getElementById("togglePassword");
const loginButton = document.getElementById("loginButton");
const message = document.getElementById("message");

// =================================
// SHOW / HIDE PASSWORD
// =================================

togglePassword.addEventListener("click", function() {

    if (passwordInput.type === "password") {

        passwordInput.type = "text";
        togglePassword.textContent = "HIDE";
        togglePassword.setAttribute("aria-label", "Hide password");

    } else {

        passwordInput.type = "password";
        togglePassword.textContent = "SHOW";
        togglePassword.setAttribute("aria-label", "Show password");

    }

});

// =================================
// LOGIN SYSTEM
// =================================

form.addEventListener("submit", function(event) {

    event.preventDefault();

    const username = usernameInput.value.trim();
    const password = passwordInput.value;

    const account = accounts.find(item =>
        item.username === username &&
        item.password === password
    );

    if (!account) {

        message.style.color = "#ff4444";
        message.textContent = "Incorrect username or password!";

        passwordInput.focus();
        passwordInput.select();

        return;
    }

    // Calculate expiration

    const expirationDate = Date.now() +
        account.days * 24 * 60 * 60 * 1000;

    localStorage.setItem(
        account.storageKey,
        expirationDate.toString()
    );

    localStorage.setItem(
        account.storageKey + "Username",
        account.username
    );

    message.style.color = "#00e676";

    message.textContent =
        "Login successful! Your access is valid for " +
        account.days + " days.";

    loginButton.disabled = true;
    loginButton.textContent = "PLEASE WAIT...";

    setTimeout(function() {

        window.location.href = "index.html";

    }, 1000);

});

// =================================
// ANDROID TV / TV BOX REMOTE SUPPORT
// =================================

const focusableElements = [
    usernameInput,
    passwordInput,
    togglePassword,
    loginButton
];

document.addEventListener("keydown", function(event) {

    const current = document.activeElement;

    const currentIndex = focusableElements.indexOf(current);

    // UP / DOWN navigation

    if (
        event.key === "ArrowDown" ||
        event.key === "ArrowUp"
    ) {

        if (currentIndex === -1) {
            usernameInput.focus();
            event.preventDefault();
            return;
        }

        event.preventDefault();

        let nextIndex;

        if (event.key === "ArrowDown") {

            nextIndex = Math.min(
                currentIndex + 1,
                focusableElements.length - 1
            );

        } else {

            nextIndex = Math.max(
                currentIndex - 1,
                0
            );

        }

        focusableElements[nextIndex].focus();

    }

    // LEFT / RIGHT on TV remote

    if (
        event.key === "ArrowLeft" ||
        event.key === "ArrowRight"
    ) {

        if (current === togglePassword) {

            event.preventDefault();

            if (event.key === "ArrowLeft") {
                passwordInput.focus();
            }

        }

    }

    // ENTER / OK selects focused buttons

    if (
        event.key === "Enter" ||
        event.key === "NumpadEnter"
    ) {

        if (current === togglePassword) {

            event.preventDefault();
            togglePassword.click();

        }

    }

});

// =================================
// INITIAL TV REMOTE FOCUS
// =================================

window.addEventListener("load", function() {

    setTimeout(function() {
        usernameInput.focus();
    }, 500);

});

</script></body>
</html>
